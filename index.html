<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Super Platform Adventure</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #08111f;
    font-family: Arial, sans-serif;
    touch-action: none;
}

/* ==============================
   GAME SCREEN
============================== */

#gameWrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 20%, #243b5c, #08111f 75%);
}

canvas {
    display: block;

    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);

    background: #65c9ff;

    image-rendering: pixelated;
    image-rendering: crisp-edges;

    box-shadow:
        0 0 50px rgba(0,0,0,.45);
}

/* ==============================
   TOP INFO
============================== */

#info {
    position: fixed;
    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    background: rgba(8,17,31,.72);

    border: 1px solid rgba(255,255,255,.18);

    padding: 9px 16px;

    border-radius: 999px;

    z-index: 10;

    font-size: 13px;

    text-align: center;

    backdrop-filter: blur(8px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

    white-space: nowrap;
}

/* ==============================
   HUD
============================== */

#hud {
    position: fixed;

    top: 12px;
    left: 15px;

    display: flex;
    gap: 10px;

    z-index: 10;
}

.stat {
    min-width: 82px;

    padding: 9px 13px;

    color: white;

    background: rgba(8,17,31,.75);

    border: 1px solid rgba(255,255,255,.16);

    border-radius: 12px;

    font-size: 16px;
    font-weight: bold;

    backdrop-filter: blur(8px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.2);
}

/* ==============================
   MOBILE CONTROLS
============================== */

#mobileControls {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 18px;

    display: flex;

    justify-content: space-between;

    padding: 0 20px;

    z-index: 20;

    pointer-events: none;
}

.controlGroup {
    display: flex;

    gap: 12px;

    pointer-events: auto;
}

.controlBtn {
    width: 68px;
    height: 68px;

    border-radius: 22px;

    border: 2px solid rgba(255,255,255,.28);

    background:
        linear-gradient(
            rgba(255,255,255,.12),
            rgba(0,0,0,.45)
        );

    color: white;

    font-size: 28px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    user-select: none;
    -webkit-user-select: none;

    box-shadow:
        0 7px 18px rgba(0,0,0,.35);

    backdrop-filter: blur(6px);

    transition: transform .08s;
}

.controlBtn:active {
    transform: scale(.91);

    background:
        rgba(255,255,255,.28);
}

#jumpBtn {
    width: 76px;
    height: 76px;

    border-radius: 50%;
}

/* ==============================
   GAME MESSAGE
============================== */

#message {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background:
        rgba(3,8,18,.78);

    color: white;

    z-index: 50;

    text-align: center;

    backdrop-filter: blur(6px);
}

#messageBox {
    padding: 35px 45px;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(30,50,80,.95),
            rgba(8,17,31,.95)
        );

    border: 1px solid rgba(255,255,255,.15);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

#message h1 {
    font-size: clamp(34px, 7vw, 60px);

    margin-bottom: 12px;
}

#message p {
    font-size: 18px;

    color: #dbeafe;
}

#restart {
    margin-top: 24px;

    padding: 13px 28px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            #ffe66d,
            #f7b928
        );

    color: #302000;

    font-weight: bold;

    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 7px 20px rgba(0,0,0,.3);
}

#restart:active {
    transform: scale(.95);
}

/* ==============================
   DESKTOP
============================== */

@media (min-width: 800px) {

    #mobileControls {
        display: none;
    }

}

/* ==============================
   MOBILE
============================== */

@media (max-width: 799px) {

    #info {
        top: auto;
        bottom: 105px;

        font-size: 11px;

        padding: 7px 11px;

        opacity: .8;
    }

    #hud {
        top: 10px;
        left: 10px;
    }

    .stat {
        min-width: auto;

        padding: 8px 11px;

        font-size: 14px;
    }

}

@media (max-height: 500px) {

    #mobileControls {
        bottom: 10px;
    }

    .controlBtn {
        width: 55px;
        height: 55px;

        border-radius: 18px;

        font-size: 23px;
    }

    #jumpBtn {
        width: 62px;
        height: 62px;
    }

}
</style>
</head>

<body>

<div id="gameWrap">
    <canvas id="game"></canvas>
</div>

<div id="info">
    ← → / A D = Bergerak &nbsp; • &nbsp;
    SPACE / W = Lompat
</div>

<div id="hud">
    <div class="stat">
        🪙 <span id="coinText">0</span>
    </div>

    <div class="stat">
        ❤️ <span id="lifeText">3</span>
    </div>
</div>

<div id="message">

    <div id="messageBox">

        <h1 id="messageTitle">
            Game Over
        </h1>

        <p id="messageText">
            Coba lagi!
        </p>

        <button id="restart">
            🔄 Main Lagi
        </button>

    </div>

</div>

<!-- MOBILE CONTROLS -->

<div id="mobileControls">

    <div class="controlGroup">

        <div class="controlBtn" id="leftBtn">
            ◀
        </div>

        <div class="controlBtn" id="rightBtn">
            ▶
        </div>

    </div>

    <div class="controlGroup">

        <div class="controlBtn" id="jumpBtn">
            ▲
        </div>

    </div>

</div>

<script>

"use strict";

/* ==================================================
   CANVAS
================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

canvas.width = 1000;
canvas.height = 600;


/* ==================================================
   GAME SETTINGS
================================================== */

const gravity = 0.7;
const speed = 5;
const jumpPower = 14;

let cameraX = 0;

let gameOver = false;
let gameWon = false;


/* ==================================================
   KEYBOARD
================================================== */

const keys = {};

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {

        keys.space = true;

        e.preventDefault();
    }

    if (
        e.key.toLowerCase() === "r" &&
        (gameOver || gameWon)
    ) {

        restartGame();
    }
});


document.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") {

        keys.space = false;
    }
});


/* ==================================================
   MOBILE
================================================== */

function mobileButton(button, key) {

    button.addEventListener(
        "touchstart",
        e => {

            e.preventDefault();

            keys[key] = true;
        },
        { passive: false }
    );


    button.addEventListener(
        "touchend",
        e => {

            e.preventDefault();

            keys[key] = false;
        },
        { passive: false }
    );


    button.addEventListener(
        "touchcancel",
        e => {

            e.preventDefault();

            keys[key] = false;
        },
        { passive: false }
    );
}


mobileButton(
    document.getElementById("leftBtn"),
    "arrowleft"
);

mobileButton(
    document.getElementById("rightBtn"),
    "arrowright"
);

mobileButton(
    document.getElementById("jumpBtn"),
    "space"
);


/* ==================================================
   PLAYER
================================================== */

const player = {

    x: 100,
    y: 400,

    width: 36,
    height: 50,

    vx: 0,
    vy: 0,

    grounded: false,

    coins: 0,
    lives: 3
};


/* ==================================================
   PLATFORMS
================================================== */

const platforms = [

    {x:0, y:550, w:1000, h:50},

    {x:80, y:450, w:150, h:25},
    {x:300, y:390, w:150, h:25},
    {x:530, y:450, w:150, h:25},
    {x:760, y:350, w:150, h:25},

    {x:1050, y:470, w:150, h:25},
    {x:1300, y:400, w:170, h:25},
    {x:1550, y:330, w:150, h:25},
    {x:1800, y:450, w:200, h:25},

    {x:2100, y:380, w:160, h:25},
    {x:2400, y:450, w:180, h:25},
    {x:2700, y:350, w:180, h:25},

    {x:3000, y:500, w:300, h:50}
];


/* ==================================================
   COINS
================================================== */

const coins = [

    {x:130, y:410, collected:false},
    {x:350, y:350, collected:false},
    {x:580, y:410, collected:false},
    {x:810, y:310, collected:false},

    {x:1100, y:430, collected:false},
    {x:1360, y:360, collected:false},
    {x:1600, y:290, collected:false},
    {x:1880, y:410, collected:false},

    {x:2160, y:340, collected:false},
    {x:2470, y:410, collected:false},
    {x:2780, y:310, collected:false}
];


/* ==================================================
   ENEMIES
================================================== */

const enemies = [

    {
        x:400,
        y:355,
        w:35,
        h:35,
        vx:2,
        minX:300,
        maxX:415,
        alive:true
    },

    {
        x:850,
        y:315,
        w:35,
        h:35,
        vx:2,
        minX:760,
        maxX:875,
        alive:true
    },

    {
        x:1400,
        y:365,
        w:35,
        h:35,
        vx:2,
        minX:1300,
        maxX:1435,
        alive:true
    },

    {
        x:1900,
        y:415,
        w:35,
        h:35,
        vx:2,
        minX:1800,
        maxX:1965,
        alive:true
    },

    {
        x:2170,
        y:345,
        w:35,
        h:35,
        vx:2,
        minX:2100,
        maxX:2225,
        alive:true
    },

    {
        x:2500,
        y:415,
        w:35,
        h:35,
        vx:2,
        minX:2400,
        maxX:2545,
        alive:true
    },

    {
        x:2800,
        y:315,
        w:35,
        h:35,
        vx:2,
        minX:2700,
        maxX:2845,
        alive:true
    }
];


/* ==================================================
   GOAL
================================================== */

const goal = {

    x:3180,
    y:430,

    w:30,
    h:70
};


/* ==================================================
   COLLISION
================================================== */

function collision(a,b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.width > b.x &&
        a.y < b.y + b.h &&
        a.y + a.height > b.y

    );
}


/* ==================================================
   RESET
================================================== */

function resetPlayer() {

    player.x = 100;
    player.y = 400;

    player.vx = 0;
    player.vy = 0;

    player.grounded = false;

    cameraX = 0;
}


/* ==================================================
   PLAYER UPDATE
================================================== */

function updatePlayer() {

    if (gameOver || gameWon)
        return;


    player.vx = 0;


    if (
        keys.arrowleft ||
        keys.a
    ) {

        player.vx = -speed;
    }


    if (
        keys.arrowright ||
        keys.d
    ) {

        player.vx = speed;
    }


    if (
        (
            keys.space ||
            keys.w ||
            keys.arrowup
        ) &&
        player.grounded
    ) {

        player.vy = -jumpPower;

        player.grounded = false;
    }


    player.vy += gravity;

    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;


    for (const platform of platforms) {

        const wasAbove =
            player.y +
            player.height -
            player.vy <=
            platform.y;

        const falling =
            player.vy >= 0;

        const horizontal =
            player.x <
            platform.x + platform.w &&
            player.x + player.width >
            platform.x;

        const vertical =
            player.y +
            player.height >=
            platform.y &&
            player.y +
            player.height <=
            platform.y +
            platform.h +
            10;


        if (
            horizontal &&
            vertical &&
            wasAbove &&
            falling
        ) {

            player.y =
                platform.y -
                player.height;

            player.vy = 0;

            player.grounded = true;
        }
    }


    if (player.x < 0)
        player.x = 0;


    if (player.y > 700) {

        loseLife();
    }


    cameraX =
        player.x - 300;


    if (cameraX < 0)
        cameraX = 0;


    const maxCamera =
        3300 - canvas.width;


    if (cameraX > maxCamera)
        cameraX = maxCamera;
}


/* ==================================================
   COINS
================================================== */

function updateCoins() {

    for (const coin of coins) {

        if (coin.collected)
            continue;


        const box = {

            x:coin.x - 12,
            y:coin.y - 12,

            width:24,
            height:24
        };


        if (collision(player,box)) {

            coin.collected = true;

            player.coins++;

            updateHUD();
        }
    }
}


/* ==================================================
   ENEMIES
================================================== */

function updateEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive)
            continue;


        enemy.x += enemy.vx;


        if (enemy.x <= enemy.minX) {

            enemy.x = enemy.minX;

            enemy.vx =
                Math.abs(enemy.vx);
        }


        if (enemy.x >= enemy.maxX) {

            enemy.x = enemy.maxX;

            enemy.vx =
                -Math.abs(enemy.vx);
        }


        const box = {

            x:enemy.x,
            y:enemy.y,

            width:enemy.w,
            height:enemy.h
        };


        if (collision(player,box)) {

            if (
                player.vy > 0 &&
                player.y +
                player.height <
                enemy.y +
                enemy.h * .7
            ) {

                enemy.alive = false;

                player.vy = -9;

            } else {

                loseLife();

                return;
            }
        }
    }
}


/* ==================================================
   LIFE
================================================== */

function loseLife() {

    if (gameOver || gameWon)
        return;


    player.lives--;

    updateHUD();


    if (player.lives <= 0) {

        endGame(false);

    } else {

        resetPlayer();
    }
}


/* ==================================================
   GOAL
================================================== */

function checkGoal() {

    const box = {

        x:goal.x,
        y:goal.y,

        width:goal.w,
        height:goal.h
    };


    if (collision(player,box)) {

        endGame(true);
    }
}


/* ==================================================
   HUD
================================================== */

function updateHUD() {

    document.getElementById("coinText")
        .textContent =
        player.coins;

    document.getElementById("lifeText")
        .textContent =
        player.lives;
}


/* ==================================================
   END GAME
================================================== */

function endGame(won) {

    if (won) {

        gameWon = true;

        document.getElementById("messageTitle")
            .textContent =
            "🎉 MENANG!";

        document.getElementById("messageText")
            .textContent =
            "Kamu berhasil mencapai garis finish!";

    } else {

        gameOver = true;

        document.getElementById("messageTitle")
            .textContent =
            "💀 GAME OVER";

        document.getElementById("messageText")
            .textContent =
            "Nyawa kamu sudah habis.";
    }


    document.getElementById("message")
        .style.display =
        "flex";
}


/* ==================================================
   RESTART
================================================== */

function restartGame() {

    player.coins = 0;
    player.lives = 3;


    for (const coin of coins)
        coin.collected = false;


    for (const enemy of enemies)
        enemy.alive = true;


    gameOver = false;
    gameWon = false;


    document.getElementById("message")
        .style.display =
        "none";


    resetPlayer();

    updateHUD();
}


document.getElementById("restart")
    .addEventListener(
        "click",
        restartGame
    );


/* ==================================================
   BACKGROUND
================================================== */

function drawBackground() {

    /* Sky gradient */

    const sky =
        ctx.createLinearGradient(
            0,0,
            0,canvas.height
        );

    sky.addColorStop(
        0,
        "#49bdf5"
    );

    sky.addColorStop(
        .55,
        "#8ee0ff"
    );

    sky.addColorStop(
        1,
        "#d8f5ff"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* Sun glow */

    const sunX =
        850 -
        cameraX * .12;

    const sunY = 95;


    const glow =
        ctx.createRadialGradient(
            sunX,
            sunY,
            10,
            sunX,
            sunY,
            100
        );

    glow.addColorStop(
        0,
        "rgba(255,245,150,.8)"
    );

    glow.addColorStop(
        1,
        "rgba(255,245,150,0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        sunX - 100,
        sunY - 100,
        200,
        200
    );


    ctx.fillStyle =
        "#ffe066";

    ctx.beginPath();

    ctx.arc(
        sunX,
        sunY,
        40,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Clouds */

    drawCloud(100,100,.9);
    drawCloud(500,145,1);
    drawCloud(850,90,.8);
    drawCloud(1250,120,1);
    drawCloud(1800,105,.9);
    drawCloud(2400,135,1);
    drawCloud(2900,90,.8);


    /* Far mountains */

    ctx.fillStyle =
        "#78b879";


    for (
        let x=-600;
        x<4200;
        x+=360
    ) {

        const sx =
            x -
            cameraX*.25;

        ctx.beginPath();

        ctx.moveTo(
            sx,
            550
        );

        ctx.lineTo(
            sx+180,
            315
        );

        ctx.lineTo(
            sx+360,
            550
        );

        ctx.fill();
    }


    /* Near mountains */

    ctx.fillStyle =
        "#4d9660";


    for (
        let x=-500;
        x<4200;
        x+=420
    ) {

        const sx =
            x -
            cameraX*.42;

        ctx.beginPath();

        ctx.moveTo(
            sx,
            550
        );

        ctx.lineTo(
            sx+210,
            365
        );

        ctx.lineTo(
            sx+420,
            550
        );

        ctx.fill();
    }


    /* Small grass background */

    ctx.fillStyle =
        "rgba(40,120,70,.25)";

    ctx.fillRect(
        0,
        520,
        canvas.width,
        30
    );
}


/* ==================================================
   CLOUD
================================================== */

function drawCloud(worldX,y,scale) {

    const x =
        worldX -
        cameraX*.22;


    ctx.fillStyle =
        "rgba(255,255,255,.82)";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        22*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+28*scale,
        y-13*scale,
        30*scale,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+60*scale,
        y,
        23*scale,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* ==================================================
   PLATFORMS
================================================== */

function drawPlatforms() {

    for (const p of platforms) {

        const x =
            p.x -
            cameraX;


        if (
            x+p.w < 0 ||
            x > canvas.width
        )
            continue;


        /* Dirt */

        const dirt =
            ctx.createLinearGradient(
                0,
                p.y,
                0,
                p.y+p.h
            );

        dirt.addColorStop(
            0,
            "#9a622f"
        );

        dirt.addColorStop(
            1,
            "#613718"
        );

        ctx.fillStyle = dirt;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );


        /* Grass */

        ctx.fillStyle =
            "#42b866";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            8
        );


        /* Grass highlight */

        ctx.fillStyle =
            "#73d681";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            3
        );


        /* Dirt details */

        ctx.fillStyle =
            "rgba(60,30,10,.45)";


        for (
            let i=12;
            i<p.w-5;
            i+=28
        ) {

            ctx.fillRect(
                x+i,
                p.y+14,
                5,
                4
            );
        }
    }
}


/* ==================================================
   COINS
================================================== */

function drawCoins() {

    const time =
        performance.now()*.005;


    for (const coin of coins) {

        if (coin.collected)
            continue;


        const x =
            coin.x -
            cameraX;


        const scale =
            .82 +
            Math.abs(Math.sin(time+coin.x))*.18;


        ctx.save();

        ctx.translate(
            x,
            coin.y
        );

        ctx.scale(
            scale,
            1
        );


        /* Glow */

        ctx.shadowColor =
            "#ffd43b";

        ctx.shadowBlur = 14;


        ctx.fillStyle =
            "#ffd43b";


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        ctx.strokeStyle =
            "#e5a900";

        ctx.lineWidth = 3;

        ctx.stroke();


        ctx.fillStyle =
            "#fff5a8";


        ctx.beginPath();

        ctx.arc(
            -3,
            -4,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.restore();
    }
}


/* ==================================================
   ENEMIES
================================================== */

function drawEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive)
            continue;


        const x =
            enemy.x -
            cameraX;


        /* Shadow */

        ctx.fillStyle =
            "rgba(0,0,0,.22)";

        ctx.fillRect(
            x+3,
            enemy.y+34,
            30,
            5
        );


        /* Body */

        ctx.fillStyle =
            "#e63946";

        ctx.fillRect(
            x,
            enemy.y+5,
            enemy.w,
            enemy.h-5
        );


        /* Head */

        ctx.fillStyle =
            "#ff4d5a";

        ctx.fillRect(
            x+3,
            enemy.y,
            enemy.w-6,
            28
        );


        /* Eyes */

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            x+7,
            enemy.y+8,
            7,
            9
        );

        ctx.fillRect(
            x+21,
            enemy.y+8,
            7,
            9
        );


        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            x+9,
            enemy.y+11,
            4,
            5
        );

        ctx.fillRect(
            x+23,
            enemy.y+11,
            4,
            5
        );


        /* Feet */

        ctx.fillStyle =
            "#711f29";

        ctx.fillRect(
            x+3,
            enemy.y+30,
            11,
            6
        );

        ctx.fillRect(
            x+21,
            enemy.y+30,
            11,
            6
        );
    }
}


/* ==================================================
   PLAYER
================================================== */

function drawPlayer() {

    const x =
        player.x -
        cameraX;

    const y =
        player.y;


    /* Shadow */

    if (player.grounded) {

        ctx.fillStyle =
            "rgba(0,0,0,.25)";

        ctx.fillRect(
            x+4,
            y+49,
            28,
            5
        );
    }


    /* Legs */

    ctx.fillStyle =
        "#17418f";

    ctx.fillRect(
        x+6,
        y+39,
        10,
        12
    );

    ctx.fillRect(
        x+20,
        y+39,
        10,
        12
    );


    /* Shoes */

    ctx.fillStyle =
        "#242424";

    ctx.fillRect(
        x+4,
        y+48,
        13,
        5
    );

    ctx.fillRect(
        x+19,
        y+48,
        13,
        5
    );


    /* Body */

    ctx.fillStyle =
        "#2463d4";

    ctx.fillRect(
        x+5,
        y+19,
        26,
        25
    );


    /* Shirt highlight */

    ctx.fillStyle =
        "#4d8cff";

    ctx.fillRect(
        x+8,
        y+21,
        7,
        18
    );


    /* Arms */

    ctx.fillStyle =
        "#e9a477";

    ctx.fillRect(
        x+1,
        y+21,
        7,
        17
    );

    ctx.fillRect(
        x+28,
        y+21,
        7,
        17
    );


    /* Head */

    ctx.fillStyle =
        "#f4b183";

    ctx.fillRect(
        x+8,
        y,
        20,
        21
    );


    /* Ear */

    ctx.fillRect(
        x+5,
        y+8,
        5,
        8
    );


    /* Hair */

    ctx.fillStyle =
        "#4b2916";

    ctx.fillRect(
        x+7,
        y,
        22,
        7
    );

    ctx.fillRect(
        x+8,
        y+5,
        5,
        5
    );

    ctx.fillRect(
        x+21,
        y+4,
        8,
        5
    );


    /* Eye */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x+22,
        y+9,
        3,
        4
    );


    /* Smile */

    ctx.fillRect(
        x+19,
        y+16,
        6,
        2
    );
}


/* ==================================================
   GOAL
================================================== */

function drawGoal() {

    const x =
        goal.x -
        cameraX;


    /* Pole */

    ctx.fillStyle =
        "#555";

    ctx.fillRect(
        x,
        goal.y,
        7,
        goal.h
    );


    ctx.fillStyle =
        "#aaa";

    ctx.fillRect(
        x+1,
        goal.y,
        2,
        goal.h
    );


    /* Flag */

    ctx.fillStyle =
        "#ffd43b";

    ctx.beginPath();

    ctx.moveTo(
        x+7,
        goal.y
    );

    ctx.lineTo(
        x+52,
        goal.y+15
    );

    ctx.lineTo(
        x+7,
        goal.y+30
    );

    ctx.closePath();

    ctx.fill();


    /* Flag detail */

    ctx.fillStyle =
        "#f59f00";

    ctx.fillRect(
        x+8,
        goal.y+13,
        20,
        4
    );
}


/* ==================================================
   DRAW
================================================== */

function draw() {

    drawBackground();

    drawPlatforms();

    drawCoins();

    drawGoal();

    drawEnemies();

    drawPlayer();
}


/* ==================================================
   UPDATE
================================================== */

function update() {

    updatePlayer();

    updateCoins();

    updateEnemies();

    checkGoal();

    updateHUD();
}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


/* ==================================================
   START
================================================== */

updateHUD();

gameLoop();

</script>

</body>
</html>

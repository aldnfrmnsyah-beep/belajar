<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Super Platform Adventure</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    margin: auto;
    background: #6ec6ff;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#info {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,.65);
    padding: 8px 15px;
    border-radius: 8px;
    z-index: 5;
    font-size: 14px;
    text-align: center;
    white-space: nowrap;
}

#hud {
    position: fixed;
    top: 55px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 9px 14px;
    border-radius: 8px;
    z-index: 5;
    font-size: 17px;
    font-weight: bold;
}

/* Kontrol HP */
#mobileControls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 20;
    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 12px;
    pointer-events: auto;
}

.controlBtn {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.5);
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 28px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
}

.controlBtn:active {
    background: rgba(255,255,255,.35);
    transform: scale(.95);
}

#message {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,.75);
    color: white;
    z-index: 50;
    text-align: center;
}

#message h1 {
    font-size: 45px;
    margin-bottom: 15px;
}

#message p {
    font-size: 19px;
}

#restart {
    margin-top: 20px;
    padding: 13px 28px;
    border: none;
    border-radius: 10px;
    background: #ffd43b;
    color: #222;
    font-weight: bold;
    font-size: 17px;
}

@media (min-width: 800px) {
    #mobileControls {
        display: none;
    }
}
</style>
</head>

<body>

<div id="info">
    ← → / A D = Bergerak &nbsp; | &nbsp; SPACE / W = Lompat
</div>

<div id="hud">
    🪙 <span id="coinText">0</span>
    &nbsp;&nbsp;
    ❤️ <span id="lifeText">3</span>
</div>

<div id="message">
    <h1 id="messageTitle">Game Over</h1>
    <p id="messageText">Coba lagi!</p>
    <button id="restart">🔄 Main Lagi</button>
</div>

<canvas id="game"></canvas>

<!-- Kontrol HP -->
<div id="mobileControls">

    <div class="controlGroup">
        <div class="controlBtn" id="leftBtn">◀</div>
        <div class="controlBtn" id="rightBtn">▶</div>
    </div>

    <div class="controlGroup">
        <div class="controlBtn" id="jumpBtn">▲</div>
    </div>

</div>

<script>

"use strict";

// ======================================
// CANVAS
// ======================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 1000;
canvas.height = 600;


// ======================================
// GAME SETTINGS
// ======================================

const gravity = 0.7;
const speed = 5;
const jumpPower = 14;

let cameraX = 0;
let gameOver = false;
let gameWon = false;


// ======================================
// KEYBOARD
// ======================================

const keys = {};

document.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        keys["space"] = true;
        e.preventDefault();
    }

    if (
        e.key.toLowerCase() === "r" &&
        (gameOver || gameWon)
    ) {
        restartGame();
    }
});

document.addEventListener("keyup", function(e) {

    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") {
        keys["space"] = false;
    }
});


// ======================================
// MOBILE CONTROL
// ======================================

function mobileButton(button, key) {

    button.addEventListener("touchstart", function(e) {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", function(e) {
        e.preventDefault();
        keys[key] = false;
    });

    button.addEventListener("touchcancel", function(e) {
        e.preventDefault();
        keys[key] = false;
    });
}

mobileButton(
    document.getElementById("leftBtn"),
    "arrowleft"
);

mobileButton(
    document.getElementById("rightBtn"),
    "arrowright"
);

mobileButton(
    document.getElementById("jumpBtn"),
    "space"
);


// ======================================
// PLAYER
// ======================================

const player = {

    x: 100,
    y: 400,

    width: 36,
    height: 50,

    vx: 0,
    vy: 0,

    grounded: false,

    coins: 0,
    lives: 3
};


// ======================================
// PLATFORMS
// ======================================

const platforms = [

    {x: 0, y: 550, w: 1000, h: 50},

    {x: 80, y: 450, w: 150, h: 25},
    {x: 300, y: 390, w: 150, h: 25},
    {x: 530, y: 450, w: 150, h: 25},
    {x: 760, y: 350, w: 150, h: 25},

    {x: 1050, y: 470, w: 150, h: 25},
    {x: 1300, y: 400, w: 170, h: 25},
    {x: 1550, y: 330, w: 150, h: 25},
    {x: 1800, y: 450, w: 200, h: 25},

    {x: 2100, y: 380, w: 160, h: 25},
    {x: 2400, y: 450, w: 180, h: 25},
    {x: 2700, y: 350, w: 180, h: 25},

    {x: 3000, y: 500, w: 300, h: 50}
];


// ======================================
// COINS
// ======================================

const coins = [

    {x: 130, y: 410, collected:false},
    {x: 350, y: 350, collected:false},
    {x: 580, y: 410, collected:false},
    {x: 810, y: 310, collected:false},

    {x: 1100, y: 430, collected:false},
    {x: 1360, y: 360, collected:false},
    {x: 1600, y: 290, collected:false},
    {x: 1880, y: 410, collected:false},

    {x: 2160, y: 340, collected:false},
    {x: 2470, y: 410, collected:false},
    {x: 2780, y: 310, collected:false}
];


// ======================================
// ENEMIES
// ======================================

const enemies = [

    {
        x: 400,
        y: 355,
        w: 35,
        h: 35,
        vx: 2,
        minX: 300,
        maxX: 415,
        alive: true
    },

    {
        x: 850,
        y: 315,
        w: 35,
        h: 35,
        vx: 2,
        minX: 760,
        maxX: 875,
        alive: true
    },

    {
        x: 1400,
        y: 365,
        w: 35,
        h: 35,
        vx: 2,
        minX: 1300,
        maxX: 1435,
        alive: true
    },

    {
        x: 1900,
        y: 415,
        w: 35,
        h: 35,
        vx: 2,
        minX: 1800,
        maxX: 1965,
        alive: true
    },

    {
        x: 2170,
        y: 345,
        w: 35,
        h: 35,
        vx: 2,
        minX: 2100,
        maxX: 2225,
        alive: true
    },

    {
        x: 2500,
        y: 415,
        w: 35,
        h: 35,
        vx: 2,
        minX: 2400,
        maxX: 2545,
        alive: true
    },

    {
        x: 2800,
        y: 315,
        w: 35,
        h: 35,
        vx: 2,
        minX: 2700,
        maxX: 2845,
        alive: true
    }
];


// ======================================
// FINISH FLAG
// ======================================

const goal = {

    x: 3180,
    y: 430,

    w: 30,
    h: 70
};


// ======================================
// COLLISION
// ======================================

function collision(a, b) {

    return (

        a.x < b.x + b.w &&

        a.x + a.width > b.x &&

        a.y < b.y + b.h &&

        a.y + a.height > b.y
    );
}


// ======================================
// RESET PLAYER
// ======================================

function resetPlayer() {

    player.x = 100;
    player.y = 400;

    player.vx = 0;
    player.vy = 0;

    player.grounded = false;

    cameraX = 0;
}


// ======================================
// PLAYER UPDATE
// ======================================

function updatePlayer() {

    if (gameOver || gameWon) return;

    player.vx = 0;


    // Gerak kiri

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.vx = -speed;
    }


    // Gerak kanan

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.vx = speed;
    }


    // Lompat

    if (
        (
            keys["space"] ||
            keys["w"] ||
            keys["arrowup"]
        ) &&
        player.grounded
    ) {

        player.vy = -jumpPower;

        player.grounded = false;
    }


    // Gravity

    player.vy += gravity;


    // Posisi

    player.x += player.vx;
    player.y += player.vy;


    player.grounded = false;


    // Platform collision

    for (const platform of platforms) {

        const wasAbove =
            player.y + player.height - player.vy <= platform.y;

        const isFalling =
            player.vy >= 0;

        const horizontal =
            player.x < platform.x + platform.w &&
            player.x + player.width > platform.x;

        const vertical =
            player.y + player.height >= platform.y &&
            player.y + player.height <=
            platform.y + platform.h + 10;


        if (
            horizontal &&
            vertical &&
            wasAbove &&
            isFalling
        ) {

            player.y =
                platform.y - player.height;

            player.vy = 0;

            player.grounded = true;
        }
    }


    // Batas kiri

    if (player.x < 0) {
        player.x = 0;
    }


    // Jatuh

    if (player.y > 700) {

        loseLife();
    }


    // Camera

    cameraX = player.x - 300;

    if (cameraX < 0) {
        cameraX = 0;
    }

    const maxCamera =
        3300 - canvas.width;

    if (cameraX > maxCamera) {
        cameraX = maxCamera;
    }
}


// ======================================
// COIN UPDATE
// ======================================

function updateCoins() {

    for (const coin of coins) {

        if (coin.collected) continue;


        const coinBox = {

            x: coin.x - 12,
            y: coin.y - 12,

            w: 24,
            h: 24
        };


        if (collision(player, coinBox)) {

            coin.collected = true;

            player.coins++;

            updateHUD();
        }
    }
}


// ======================================
// ENEMY UPDATE
// ======================================

function updateEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive) continue;


        enemy.x += enemy.vx;


        // Patrol

        if (enemy.x <= enemy.minX) {

            enemy.x = enemy.minX;

            enemy.vx =
                Math.abs(enemy.vx);
        }


        if (enemy.x >= enemy.maxX) {

            enemy.x = enemy.maxX;

            enemy.vx =
                -Math.abs(enemy.vx);
        }


        const enemyBox = {

            x: enemy.x,
            y: enemy.y,

            w: enemy.w,
            h: enemy.h
        };


        if (collision(player, enemyBox)) {


            // Menginjak musuh

            if (
                player.vy > 0 &&
                player.y + player.height <
                enemy.y + enemy.h * 0.7
            ) {

                enemy.alive = false;

                player.vy = -9;

            } else {

                loseLife();

                return;
            }
        }
    }
}


// ======================================
// LOSE LIFE
// ======================================

function loseLife() {

    if (gameOver || gameWon) return;


    player.lives--;

    updateHUD();


    if (player.lives <= 0) {

        endGame(false);

    } else {

        resetPlayer();
    }
}


// ======================================
// CHECK GOAL
// ======================================

function checkGoal() {

    const goalBox = {

        x: goal.x,
        y: goal.y,

        w: goal.w,
        h: goal.h
    };


    if (collision(player, goalBox)) {

        endGame(true);
    }
}


// ======================================
// HUD
// ======================================

function updateHUD() {

    document.getElementById("coinText")
        .textContent = player.coins;

    document.getElementById("lifeText")
        .textContent = player.lives;
}


// ======================================
// END GAME
// ======================================

function endGame(won) {

    if (won) {

        gameWon = true;

        document.getElementById("messageTitle")
            .textContent = "🎉 MENANG!";

        document.getElementById("messageText")
            .textContent =
            "Kamu berhasil mencapai garis finish!";

    } else {

        gameOver = true;

        document.getElementById("messageTitle")
            .textContent = "💀 GAME OVER";

        document.getElementById("messageText")
            .textContent =
            "Nyawa kamu sudah habis.";
    }


    document.getElementById("message")
        .style.display = "flex";
}


// ======================================
// RESTART GAME
// ======================================

function restartGame() {

    player.coins = 0;

    player.lives = 3;


    for (const coin of coins) {

        coin.collected = false;
    }


    for (const enemy of enemies) {

        enemy.alive = true;
    }


    gameOver = false;
    gameWon = false;


    document.getElementById("message")
        .style.display = "none";


    resetPlayer();

    updateHUD();
}


// ======================================
// RESTART BUTTON
// ======================================

document.getElementById("restart")
    .addEventListener("click", restartGame);


// ======================================
// DRAW BACKGROUND
// ======================================

function drawBackground() {

    // Langit

    ctx.fillStyle = "#6ec6ff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Matahari

    const sunX =
        850 - cameraX * 0.15;

    ctx.fillStyle = "#ffd43b";

    ctx.beginPath();

    ctx.arc(
        sunX,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Awan

    const clouds = [

        {x:100, y:100},
        {x:500, y:140},
        {x:850, y:90},
        {x:1200, y:120},
        {x:1800, y:100},
        {x:2400, y:140},
        {x:2900, y:90}
    ];


    ctx.fillStyle =
        "rgba(255,255,255,.85)";


    for (const cloud of clouds) {

        const x =
            cloud.x -
            cameraX * 0.25;


        ctx.beginPath();

        ctx.arc(
            x,
            cloud.y,
            25,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            cloud.y - 10,
            35,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 65,
            cloud.y,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // Gunung

    ctx.fillStyle = "#6aaa50";


    for (
        let x = -500;
        x < 4000;
        x += 350
    ) {

        const screenX =
            x - cameraX * 0.5;


        ctx.beginPath();

        ctx.moveTo(
            screenX,
            550
        );

        ctx.lineTo(
            screenX + 175,
            300
        );

        ctx.lineTo(
            screenX + 350,
            550
        );

        ctx.fill();
    }
}


// ======================================
// DRAW PLATFORMS
// ======================================

function drawPlatforms() {

    for (const platform of platforms) {

        const x =
            platform.x - cameraX;


        if (
            x + platform.w < 0 ||
            x > canvas.width
        ) {
            continue;
        }


        // Tanah

        ctx.fillStyle = "#8b5a2b";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            platform.h
        );


        // Rumput

        ctx.fillStyle = "#42a85f";

        ctx.fillRect(
            x,
            platform.y,
            platform.w,
            7
        );


        // Detail tanah

        ctx.fillStyle = "#70451f";


        for (
            let i = 10;
            i < platform.w;
            i += 30
        ) {

            ctx.fillRect(
                x + i,
                platform.y + 12,
                5,
                5
            );
        }
    }
}


// ======================================
// DRAW COINS
// ======================================

function drawCoins() {

    for (const coin of coins) {

        if (coin.collected) continue;


        const x =
            coin.x - cameraX;


        ctx.fillStyle = "#ffd43b";


        ctx.beginPath();

        ctx.arc(
            x,
            coin.y,
            11,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle = "#fff4a3";


        ctx.beginPath();

        ctx.arc(
            x - 3,
            coin.y - 3,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// ======================================
// DRAW ENEMIES
// ======================================

function drawEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive) continue;


        const x =
            enemy.x - cameraX;


        // Badan

        ctx.fillStyle = "#e63946";

        ctx.fillRect(
            x,
            enemy.y,
            enemy.w,
            enemy.h
        );


        // Mata

        ctx.fillStyle = "white";

        ctx.fillRect(
            x + 7,
            enemy.y + 8,
            7,
            8
        );

        ctx.fillRect(
            x + 21,
            enemy.y + 8,
            7,
            8
        );


        // Pupil

        ctx.fillStyle = "#111";

        ctx.fillRect(
            x + 9,
            enemy.y + 10,
            4,
            5
        );

        ctx.fillRect(
            x + 23,
            enemy.y + 10,
            4,
            5
        );


        // Kaki

        ctx.fillStyle = "#7f1d1d";

        ctx.fillRect(
            x + 3,
            enemy.y + 30,
            10,
            5
        );

        ctx.fillRect(
            x + 22,
            enemy.y + 30,
            10,
            5
        );
    }
}


// ======================================
// DRAW PLAYER
// ======================================

function drawPlayer() {

    const x =
        player.x - cameraX;

    const y =
        player.y;


    // Badan

    ctx.fillStyle = "#e63946";

    ctx.fillRect(
        x + 5,
        y + 15,
        26,
        30
    );


    // Baju

    ctx.fillStyle = "#2563eb";

    ctx.fillRect(
        x + 5,
        y + 30,
        26,
        15
    );


    // Kepala

    ctx.fillStyle = "#f4b183";

    ctx.fillRect(
        x + 8,
        y,
        20,
        20
    );


    // Rambut

    ctx.fillStyle = "#5b321a";

    ctx.fillRect(
        x + 7,
        y,
        22,
        7
    );


    // Mata

    ctx.fillStyle = "#111";

    ctx.fillRect(
        x + 22,
        y + 8,
        3,
        3
    );


    // Kaki

    ctx.fillStyle = "#173f8a";

    ctx.fillRect(
        x + 7,
        y + 43,
        9,
        7
    );

    ctx.fillRect(
        x + 20,
        y + 43,
        9,
        7
    );


    // Sepatu

    ctx.fillStyle = "#222";

    ctx.fillRect(
        x + 5,
        y + 48,
        12,
        4
    );

    ctx.fillRect(
        x + 19,
        y + 48,
        12,
        4
    );
}


// ======================================
// DRAW GOAL
// ======================================

function drawGoal() {

    const x =
        goal.x - cameraX;


    // Tiang

    ctx.fillStyle = "#444";

    ctx.fillRect(
        x,
        goal.y,
        6,
        goal.h
    );


    // Bendera

    ctx.fillStyle = "#ffd43b";

    ctx.beginPath();

    ctx.moveTo(
        x + 6,
        goal.y
    );

    ctx.lineTo(
        x + 48,
        goal.y + 15
    );

    ctx.lineTo(
        x + 6,
        goal.y + 30
    );

    ctx.closePath();

    ctx.fill();
}


// ======================================
// DRAW
// ======================================

function draw() {

    drawBackground();

    drawPlatforms();

    drawCoins();

    drawGoal();

    drawEnemies();

    drawPlayer();
}


// ======================================
// UPDATE
// ======================================

function update() {

    updatePlayer();

    updateCoins();

    updateEnemies();

    checkGoal();

    updateHUD();
}


// ======================================
// GAME LOOP
// ======================================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


// ======================================
// START
// ======================================

updateHUD();

gameLoop();

</script>

</body>
</html>

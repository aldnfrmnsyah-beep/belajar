<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐍 Snake Neon</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at top, #12351a 0%, #050805 35%, #000 75%);
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    .container {
        width: 100%;
        max-width: 430px;
        padding: 20px;
        text-align: center;
    }

    /* =========================
       HEADER
    ========================= */

    .title {
        font-size: 32px;
        margin-bottom: 5px;
        color: #00ff44;
        text-shadow:
            0 0 5px #00ff44,
            0 0 15px #00ff44;
    }

    .subtitle {
        color: #888;
        font-size: 13px;
        margin-bottom: 18px;
    }

    /* =========================
       SCORE
    ========================= */

    .score-box {
        display: flex;
        justify-content: space-between;
        align-items: center;

        width: 280px;
        margin: 0 auto 12px;

        padding: 10px 15px;

        background: rgba(15, 15, 15, 0.9);
        border: 1px solid #333;
        border-radius: 12px;

        box-shadow: 0 0 15px rgba(0, 255, 60, 0.08);
    }

    .score-label {
        color: #999;
        font-size: 13px;
    }

    #score {
        color: #00ff44;
        font-size: 20px;
        font-weight: bold;

        text-shadow: 0 0 8px #00ff44;
    }

    /* =========================
       GAME
    ========================= */

    .game-wrapper {
        position: relative;

        width: 284px;
        height: 284px;

        margin: auto;

        border: 2px solid #00ff44;
        border-radius: 10px;

        background: #080808;

        box-shadow:
            0 0 10px rgba(0, 255, 68, 0.4),
            0 0 35px rgba(0, 255, 68, 0.15);

        overflow: hidden;
    }

    canvas {
        width: 280px;
        height: 280px;

        display: block;

        background:
            linear-gradient(
                rgba(255,255,255,0.025) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(255,255,255,0.025) 1px,
                transparent 1px
            );

        background-size: 14px 14px;
    }

    /* =========================
       GAME OVER
    ========================= */

    #gameOver {
        position: absolute;
        inset: 0;

        display: none;

        justify-content: center;
        align-items: center;

        flex-direction: column;

        background: rgba(0, 0, 0, 0.88);

        z-index: 10;
    }

    #gameOver.show {
        display: flex;
    }

    #gameOver h1 {
        color: #ff3030;

        font-size: 34px;
        margin-bottom: 8px;

        text-shadow:
            0 0 8px red,
            0 0 20px red;
    }

    #finalScore {
        color: #fff;
        font-size: 17px;
        margin-bottom: 18px;
    }

    .restart-btn {
        border: none;

        padding: 12px 25px;

        border-radius: 30px;

        background: #00ff44;
        color: #000;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 0 10px #00ff44,
            0 0 25px rgba(0,255,68,0.4);

        transition: 0.15s;
    }

    .restart-btn:active {
        transform: scale(0.94);
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
        margin-top: 18px;
    }

    .control-info {
        color: #777;
        font-size: 12px;
        margin-bottom: 10px;
    }

    /* =========================
       JOYSTICK
    ========================= */

    #joystick {
        width: 125px;
        height: 125px;

        margin: auto;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                #181818 0%,
                #0d0d0d 70%
            );

        border: 3px solid #00ff44;

        position: relative;

        touch-action: none;

        box-shadow:
            0 0 10px rgba(0,255,68,0.4),
            inset 0 0 15px rgba(0,255,68,0.08);
    }

    /* garis arah */

    #joystick::before,
    #joystick::after {
        content: "";

        position: absolute;

        background: rgba(0,255,68,0.15);
    }

    #joystick::before {
        width: 1px;
        height: 100%;

        left: 50%;
        top: 0;
    }

    #joystick::after {
        width: 100%;
        height: 1px;

        top: 50%;
        left: 0;
    }

    #stick {
        width: 56px;
        height: 56px;

        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 30%,
                #6aff8a,
                #00d936 55%,
                #00a52a
            );

        box-shadow:
            0 0 10px #00ff44,
            0 0 25px rgba(0,255,68,0.5);

        z-index: 2;
    }

    /* =========================
       PAUSE BUTTON
    ========================= */

    .pause-btn {
        margin-top: 12px;

        border: 1px solid #444;

        background: #111;
        color: #aaa;

        padding: 8px 18px;

        border-radius: 20px;

        cursor: pointer;

        font-size: 13px;
    }

    .pause-btn:hover {
        color: white;
        border-color: #00ff44;
    }

    /* =========================
       PAUSE OVERLAY
    ========================= */

    #pauseScreen {
        position: absolute;
        inset: 0;

        display: none;

        justify-content: center;
        align-items: center;

        background: rgba(0,0,0,0.75);

        z-index: 8;
    }

    #pauseScreen span {
        color: #00ff44;

        font-size: 30px;
        font-weight: bold;

        text-shadow: 0 0 10px #00ff44;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 600px) {

        .container {
            padding: 10px;
        }

        .title {
            font-size: 36px;
        }

        #joystick {
            width: 130px;
            height: 130px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1 class="title">🐍 Snake</h1>

    <p class="subtitle">
        Makan makanan • Jangan menabrak
    </p>

    <!-- SCORE -->

    <div class="score-box">

        <span class="score-label">
            SKOR
        </span>

        <span id="score">
            0
        </span>

    </div>


    <!-- GAME -->

    <div class="game-wrapper">

        <canvas
            id="canvas"
            width="280"
            height="280">
        </canvas>


        <!-- PAUSE -->

        <div id="pauseScreen">
            <span>PAUSED</span>
        </div>


        <!-- GAME OVER -->

        <div id="gameOver">

            <h1>GAME OVER</h1>

            <div id="finalScore">
                Skor: 0
            </div>

            <button
                class="restart-btn"
                id="restart">
                🔄 Main Lagi
            </button>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <div class="control-info">
            🕹️ Geser analog untuk bergerak
        </div>

        <div id="joystick">

            <div id="stick"></div>

        </div>

        <button
            class="pause-btn"
            id="pauseButton">
            ⏸️ Pause
        </button>

    </div>

</div>


<script>

/* =========================================
   ELEMENT
========================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreText =
    document.getElementById("score");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const restart =
    document.getElementById("restart");

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

const pauseButton =
    document.getElementById("pauseButton");

const pauseScreen =
    document.getElementById("pauseScreen");


/* =========================================
   GAME SETTINGS
========================================= */

const GRID = 20;

const TILE = 14;

const SPEED = 120;


/* =========================================
   GAME VARIABLES
========================================= */

let snake = [];

let food = {};

let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};

let score = 0;

let gameRunning = false;

let paused = false;

let gameLoop;


/* =========================================
   START GAME
========================================= */

function startGame() {

    snake = [

        { x: 10, y: 10 },

        { x: 9, y: 10 },

        { x: 8, y: 10 }

    ];


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    gameRunning = true;

    paused = false;


    scoreText.textContent =
        "0";


    gameOver.classList.remove(
        "show"
    );


    pauseScreen.style.display =
        "none";


    pauseButton.textContent =
        "⏸️ Pause";


    resetJoystick();


    createFood();

    draw();


    clearInterval(gameLoop);

    gameLoop = setInterval(
        update,
        SPEED
    );
}


/* =========================================
   CREATE FOOD
========================================= */

function createFood() {

    do {

        food = {

            x: Math.floor(
                Math.random() * GRID
            ),

            y: Math.floor(
                Math.random() * GRID
            )

        };

    } while (

        snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        )

    );
}


/* =========================================
   UPDATE GAME
========================================= */

function update() {

    if (
        !gameRunning ||
        paused
    ) {
        return;
    }


    direction =
        nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* =========================
       WALL COLLISION
    ========================= */

    if (

        head.x < 0 ||

        head.x >= GRID ||

        head.y < 0 ||

        head.y >= GRID

    ) {

        die();

        return;
    }


    /* =========================
       BODY COLLISION
    ========================= */

    const willEat =
        head.x === food.x &&
        head.y === food.y;


    /*
       Jika tidak makan,
       ekor akan bergerak keluar.
       Jadi bagian ekor tidak perlu
       dianggap sebagai collision.
    */

    const bodyToCheck =
        willEat
            ? snake
            : snake.slice(0, -1);


    if (

        bodyToCheck.some(

            part =>
                part.x === head.x &&
                part.y === head.y

        )

    ) {

        die();

        return;
    }


    /* =========================
       MOVE
    ========================= */

    snake.unshift(head);


    /* =========================
       EAT FOOD
    ========================= */

    if (willEat) {

        score++;

        scoreText.textContent =
            score;


        createFood();

    } else {

        snake.pop();

    }


    draw();
}


/* =========================================
   DRAW
========================================= */

function draw() {

    /* Background */

    ctx.fillStyle =
        "#080808";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Grid */

    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= GRID;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * TILE,
            0
        );

        ctx.lineTo(
            i * TILE,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * TILE
        );

        ctx.lineTo(
            canvas.width,
            i * TILE
        );

        ctx.stroke();
    }


    /* =========================
       FOOD
    ========================= */

    const foodX =
        food.x * TILE;

    const foodY =
        food.y * TILE;


    ctx.shadowColor =
        "#ff3030";

    ctx.shadowBlur = 12;

    ctx.fillStyle =
        "#ff3030";


    ctx.beginPath();

    ctx.arc(

        foodX + TILE / 2,

        foodY + TILE / 2,

        TILE / 2 - 2,

        0,

        Math.PI * 2

    );

    ctx.fill();


    ctx.shadowBlur = 0;


    /* =========================
       SNAKE
    ========================= */

    snake.forEach(
        (part, index) => {

            const x =
                part.x * TILE;

            const y =
                part.y * TILE;


            if (index === 0) {

                /* HEAD */

                ctx.shadowColor =
                    "#00ff44";

                ctx.shadowBlur = 10;

                ctx.fillStyle =
                    "#00ff44";

            } else {

                ctx.shadowBlur = 0;

                ctx.fillStyle =
                    "#00b832";

            }


            /* Rounded body */

            const radius =
                index === 0 ? 4 : 3;


            roundedRect(

                ctx,

                x + 1,

                y + 1,

                TILE - 2,

                TILE - 2,

                radius

            );

            ctx.fill();


            /* Eyes */

            if (index === 0) {

                drawEyes(
                    x,
                    y
                );

            }

        }
    );


    ctx.shadowBlur = 0;
}


/* =========================================
   ROUNDED RECT
========================================= */

function roundedRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}


/* =========================================
   SNAKE EYES
========================================= */

function drawEyes(x, y) {

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#001a08";


    let eye1;
    let eye2;


    if (direction.x === 1) {

        eye1 = {
            x: x + 10,
            y: y + 4
        };

        eye2 = {
            x: x + 10,
            y: y + 10
        };

    } else if (direction.x === -1) {

        eye1 = {
            x: x + 4,
            y: y + 4
        };

        eye2 = {
            x: x + 4,
            y: y + 10
        };

    } else if (direction.y === -1) {

        eye1 = {
            x: x + 4,
            y: y + 4
        };

        eye2 = {
            x: x + 10,
            y: y + 4
        };

    } else {

        eye1 = {
            x: x + 4,
            y: y + 10
        };

        eye2 = {
            x: x + 10,
            y: y + 10
        };

    }


    ctx.beginPath();

    ctx.arc(
        eye1.x,
        eye1.y,
        1.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2.x,
        eye2.y,
        1.5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================
   GAME OVER
========================================= */

function die() {

    gameRunning = false;

    clearInterval(gameLoop);


    finalScore.textContent =
        "Skor: " + score;


    gameOver.classList.add(
        "show"
    );


    resetJoystick();
}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key;


        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                " "
            ].includes(key)
        ) {

            event.preventDefault();

        }


        if (
            key === " "
        ) {

            togglePause();

            return;
        }


        if (!gameRunning) {
            return;
        }


        if (
            key === "ArrowUp" &&
            direction.y === 0
        ) {

            nextDirection = {
                x: 0,
                y: -1
            };

        }


        if (
            key === "ArrowDown" &&
            direction.y === 0
        ) {

            nextDirection = {
                x: 0,
                y: 1
            };

        }


        if (
            key === "ArrowLeft" &&
            direction.x === 0
        ) {

            nextDirection = {
                x: -1,
                y: 0
            };

        }


        if (
            key === "ArrowRight" &&
            direction.x === 0
        ) {

            nextDirection = {
                x: 1,
                y: 0
            };

        }

    }
);


/* =========================================
   JOYSTICK
========================================= */

let touching = false;


joystick.addEventListener(
    "pointerdown",
    function(event) {

        if (!gameRunning) {
            return;
        }

        touching = true;

        joystick.setPointerCapture(
            event.pointerId
        );

        moveJoystick(event);
    }
);


joystick.addEventListener(
    "pointermove",
    function(event) {

        if (!touching) {
            return;
        }

        moveJoystick(event);
    }
);


joystick.addEventListener(
    "pointerup",
    function() {

        touching = false;

        resetJoystick();
    }
);


joystick.addEventListener(
    "pointercancel",
    function() {

        touching = false;

        resetJoystick();
    }
);


/* =========================================
   MOVE JOYSTICK
========================================= */

function moveJoystick(event) {

    if (
        !gameRunning ||
        paused
    ) {
        return;
    }


    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        event.clientX -
        centerX;


    let dy =
        event.clientY -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const maxDistance = 34;


    if (
        distance > maxDistance
    ) {

        dx =
            dx / distance *
            maxDistance;

        dy =
            dy / distance *
            maxDistance;

    }


    stick.style.left =
        `calc(50% + ${dx}px)`;


    stick.style.top =
        `calc(50% + ${dy}px)`;


    const threshold = 10;


    /* Horizontal */

    if (
        Math.abs(dx) >
        Math.abs(dy)
    ) {

        if (
            dx > threshold &&
            direction.x === 0
        ) {

            nextDirection = {
                x: 1,
                y: 0
            };

        }


        if (
            dx < -threshold &&
            direction.x === 0
        ) {

            nextDirection = {
                x: -1,
                y: 0
            };

        }

    }

    /* Vertical */

    else {

        if (
            dy > threshold &&
            direction.y === 0
        ) {

            nextDirection = {
                x: 0,
                y: 1
            };

        }


        if (
            dy < -threshold &&
            direction.y === 0
        ) {

            nextDirection = {
                x: 0,
                y: -1
            };

        }

    }
}


/* =========================================
   RESET JOYSTICK
========================================= */

function resetJoystick() {

    stick.style.left =
        "50%";

    stick.style.top =
        "50%";
}


/* =========================================
   PAUSE
========================================= */

function togglePause() {

    if (!gameRunning) {
        return;
    }


    paused =
        !paused;


    if (paused) {

        pauseScreen.style.display =
            "flex";

        pauseButton.textContent =
            "▶️ Lanjut";

        resetJoystick();

    } else {

        pauseScreen.style.display =
            "none";

        pauseButton.textContent =
            "⏸️ Pause";

    }
}


pauseButton.addEventListener(
    "click",
    togglePause
);


/* =========================================
   RESTART
========================================= */

restart.addEventListener(
    "click",
    startGame
);


/* =========================================
   START
========================================= */

startGame();

</script>

</body>
</html>
